name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The end-to-end tests start the language server from the ant repository's default branch.
      - uses: actions/checkout@v4
        with:
          repository: ant-src/ant
          path: ant
      - uses: actions/setup-go@v5
        with:
          go-version-file: ant/go.mod
      - name: Build ant
        run: go build -o "$RUNNER_TEMP/ant" ./cmd/ant
        working-directory: ant
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the plugin
        run: ./gradlew check buildPlugin --no-daemon
        env:
          ANT_PATH: ${{ runner.temp }}/ant
          ANT_REPO: ${{ github.workspace }}/ant
      - name: Verify against the supported IDEs
        if: github.event_name == 'push'
        run: ./gradlew verifyPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
